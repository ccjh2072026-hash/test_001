                      gridTemplateColumns: '130px repeat(6, minmax(130px, 1fr))',
                      display: 'grid'
                    }}
                  >
                    <div 
                      style={{ gridColumn: 1, gridRow: 1 }} 
                      className="p-3 bg-slate-100 flex items-center justify-center font-bold text-xs text-slate-500 border-b border-slate-200 select-none"
                    >
                      節次 / 時間
                    </div>
                    {currentWeekDays.map((day, dIdx) => (
                      <div 
                        key={`day-header-${dIdx}`}
                        style={{ gridColumn: dIdx + 2, gridRow: 1 }} 
                        className={`p-3 text-center bg-slate-100 text-slate-700 font-bold border-b border-slate-200 select-none ${
                          day.isToday ? "bg-amber-100/70 text-indigo-900" : ""
                        }`}
                      >
                        <div className="flex flex-col items-center">
                          <span className="text-xs font-semibold opacity-70">週{day.dayZh}</span>
                          <span className="text-sm font-extrabold mt-0.5">{day.monthDayStr}</span>
                          {day.isToday && (
                            <span className="mt-1 px-1.5 py-0.2 bg-amber-200 text-amber-900 rounded-md text-[9px] scale-90">今日</span>
                          )}
                        </div>
                      </div>
                    ))}
                    {SESSIONS.map((session, sIdx) => (
                      <div 
                        key={`sess-header-${sIdx}`}
                        style={{ gridColumn: 1, gridRow: sIdx + 2 }} 
                        className={`p-3 flex flex-col justify-center border-r border-slate-200 select-none ${session.bg} ${session.border}`}
                      >
                        <span className={`text-xs font-bold flex items-center gap-1.5 ${session.text}`}>
                          {!session.reservable && <i data-lucide="lock" className="w-3 h-3"></i>}
                          {session.name}
                        </span>
                        <span className="text-[10px] text-slate-400 mt-0.5">{session.time}</span>
                      </div>
                    ))}
                    {currentWeekDays.map((day, dIdx) => 
                      SESSIONS.map((session, sIdx) => {
                        // 判斷邏輯：管理員登入時顯示所有紀錄；一般使用者僅顯示已指派平板編號之紀錄
                        const cellReservations = reservations.filter(res => 
                          res.date === day.dateStr && 
                          res.sessions.includes(session.name) &&
                          (isAdmin || (res.tabletCode && res.tabletCode.trim() !== ""))
                        );
                        const hasReservations = cellReservations.length > 0;
                        return (
                          <div
                            key={`cell-${dIdx}-${sIdx}`}
                            style={{ 
                              gridColumn: dIdx + 2, 
                              gridRow: sIdx + 2 
                            }}
                            className={`p-2 bg-white min-h-[105px] flex flex-col justify-between border-b border-r border-slate-200/60 ${
                              !session.reservable && !hasReservations ? 'locked-stripes' : ''
                            }`}
                          >
                            {hasReservations ? (
                              <div className="space-y-1.5 w-full h-full flex flex-col justify-between">
                                {cellReservations.map((res) => {
                                  let cardColor = "bg-indigo-50 border-indigo-200 text-indigo-900 hover:bg-indigo-100/80";
                                  if (res.purpose === "研習") cardColor = "bg-amber-50 border-amber-200 text-amber-900 hover:bg-amber-100/80";
                                  if (res.purpose === "行政業務") cardColor = "bg-slate-50 border-slate-300 text-slate-900 hover:bg-slate-100/80";
                                  if (res.purpose === "社團") cardColor = "bg-emerald-50 border-emerald-200 text-emerald-900 hover:bg-emerald-100/80";
                                  if (res.purpose === "其他") cardColor = "bg-purple-50 border-purple-200 text-purple-900 hover:bg-purple-100/80";
                                  
                                  const isUnassigned = !res.tabletCode || res.tabletCode.trim() === "";

                                  return (
                                    <div 
                                      key={res.id} 
                                      className="bg-white rounded-lg p-2 border border-slate-200 shadow-sm hover:shadow transition relative group"
>
                                      <div className="flex items-center justify-between font-bold text-slate-800 text-xs">
                                        <span className="truncate pr-1">{res.teacher} 老師</span>
                                        <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-normal flex-shrink-0">
                                          {res.grade}
                                        </span>
                                      </div>

                                      {/* 浮窗 Pop-over (僅在管理員登錄後才顯示) */}
                                      {isAdmin && (
                                        <div className="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-52 bg-slate-900 text-white text-[11px] p-2.5 rounded-xl shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none z-30">
                                          <p className="font-bold border-b border-slate-700 pb-1 mb-1 text-indigo-300">
                                            預約詳細資訊
                                          </p>
                                          <p><span className="text-slate-400">借用人：</span>{res.teacher} 老師</p>
                                          <p><span className="text-slate-400">班級：</span>{res.grade}</p>
                                          <p><span className="text-slate-400">用途：</span>{res.purpose}</p>
                                          <p><span className="text-slate-400">Email：</span>{res.email}</p>
                                          {res.note && <p><span className="text-slate-400">備註：</span>{res.note}</p>}
                                          <p><span className="text-slate-400">平板編號：</span>{res.tabletCode || "未指派"}</p>
                                          <div className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-900"></div>
                                        </div>
                                      )}

                                      <div className="mt-1 flex items-center justify-between text-[11px] gap-1">
                                        {isUnassigned ? (
                                          <span className="bg-red-50 text-red-600 text-[10px] px-1.5 py-0.5 rounded font-medium border border-red-100 flex-1 truncate">
                                            ⚠️ 未指派平板
                                          </span>
                                        ) : (
                                          <span className="bg-white/85 px-1.5 py-0.5 rounded text-[9px] text-slate-700 font-bold border border-slate-200/50 font-mono break-all leading-normal flex-1">
                                            🏷️ {res.tabletCode}
                                          </span>
                                        )}
                                        {isAdmin && (
                                          <button
                                            onClick={() => openTabletAssign(res)}
                                            className={`p-1 rounded-lg transition ml-auto flex-shrink-0 mt-0.5 ${
                                              isUnassigned 
                                                ? "bg-red-600 hover:bg-red-700 text-white animate-pulse" 
                                                : "bg-indigo-600 hover:bg-indigo-700 text-white"
                                            }`}
                                            title={isUnassigned ? "點擊立即指派平板編號" : "管理端：修改平板編號"}
                                          >
                                            <i data-lucide={isUnassigned ? "plus-circle" : "edit-3"} className="w-2.5 h-2.5"></i>
                                          </button>
                                        )}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            ) : session.reservable ? (
                              <button
                                onClick={() => handleQuickBook(day.dateStr, session.name)}
                                className="w-full h-full min-h-[60px] rounded-lg border border-dashed border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/40 hover:text-indigo-600 transition flex items-center justify-center text-slate-300 group relative"
                                title="點此快速預約該時段"
                              >
                                <i data-lucide="plus" className="w-4 h-4 opacity-0 group-hover:opacity-100 transition duration-150"></i>
                                <span className="text-[10px] font-medium opacity-100 group-hover:opacity-0 transition duration-150 absolute">可借用</span>
                              </button>
                            ) : (
                              <div className="w-full h-full min-h-[60px] rounded-lg flex flex-col items-center justify-center text-slate-400 select-none">
                                <i data-lucide="lock" className="w-3.5 h-3.5 opacity-40"></i>
                                <span className="text-[9px] mt-0.5 font-bold tracking-tight text-slate-400">不開放</span>
                              </div>
                            )}
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
                <div className="bg-slate-50 border-t border-slate-200 p-4 flex flex-wrap gap-4 justify-center text-xs">
                  <span className="font-semibold text-slate-500">時段底色圖例:</span>
                  <div className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-purple-100 rounded border border-purple-200"></span><span>早自習(不開放)</span></div>
                  <div className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-blue-100 rounded border border-blue-200"></span><span>1~4節</span></div>
                  <div className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-amber-100 rounded border border-amber-200"></span><span>中午</span></div>
                  <div className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-rose-100 rounded border border-rose-200"></span><span>5~7節</span></div>
                  <div className="flex items-center gap-1.5"><span className="w-3.5 h-3.5 bg-emerald-100 rounded border border-emerald-200"></span><span>第8節</span></div>
                </div>
              </div>
            )}

            {/* TAB 4: TABLET STATS */}
            {activeTab === "stats" && isAdmin && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden animate-fadeIn space-y-6 p-4 md:p-6">
                
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-200">
                  <div>
                    <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                      <i data-lucide="bar-chart-3" className="text-indigo-600 w-6 h-6"></i>
                      平板設備借用次數統計
                    </h2>
                    <p className="text-slate-500 text-xs mt-1">
                      根據預約明細紀錄表中的「分配平板編號」自動累計各組平板借用次數與使用熱度。
                    </p>
                  </div>
                  
                  {isPrimaryAdmin && (
                    <button
                      onClick={handleExportTabletStatsCsv}
                      className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 transition shadow-sm self-start md:self-auto"
                    >
                      <i data-lucide="download" className="w-4 h-4"></i>
                      匯出統計報表 (CSV)
                    </button>
                  )}
                </div>

                <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
                  <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                    
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-slate-700 whitespace-nowrap flex items-center gap-1">
                        <i data-lucide="calendar" className="w-4 h-4 text-indigo-600"></i>
                        篩選模式：
                      </span>
                      <div className="inline-flex p-1 bg-slate-200/80 rounded-xl text-xs font-semibold">
                        <button
                          onClick={() => setStatsDateMode("year")}
                          className={`px-3 py-1.5 rounded-lg transition ${statsDateMode === "year" ? "bg-white text-indigo-700 shadow-sm font-bold" : "text-slate-600 hover:text-slate-900"}`}
                        >
                          年份
                        </button>
                        <button
                          onClick={() => setStatsDateMode("month")}
                          className={`px-3 py-1.5 rounded-lg transition ${statsDateMode === "month" ? "bg-white text-indigo-700 shadow-sm font-bold" : "text-slate-600 hover:text-slate-900"}`}
                        >
                          月份
                        </button>
                        <button
                          onClick={() => setStatsDateMode("week")}
                          className={`px-3 py-1.5 rounded-lg transition ${statsDateMode === "week" ? "bg-white text-indigo-700 shadow-sm font-bold" : "text-slate-600 hover:text-slate-900"}`}
                        >
                          週次
                        </button>
                        <button
                          onClick={() => setStatsDateMode("custom")}
                          className={`px-3 py-1.5 rounded-lg transition ${statsDateMode === "custom" ? "bg-white text-indigo-700 shadow-sm font-bold" : "text-slate-600 hover:text-slate-900"}`}
                        >
                          自定義起訖
                        </button>
                      </div>
                    </div>

                    <div className="flex items-center gap-3">
                      <span className="text-xs font-bold text-slate-700 whitespace-nowrap">計算方式：</span>
                      <label className="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer font-medium">
                        <input
                          type="radio"
                          name="countMode"
                          checked={statsCountMode === "count"}
                          onChange={() => setStatsCountMode("count")}
                          className="text-indigo-600"
                        />
                        按預約次數累計 (1次預約=1次)
                      </label>
                      <label className="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer font-medium">
                        <input
                          type="radio"
                          name="countMode"
                          checked={statsCountMode === "sessions"}
                          onChange={() => setStatsCountMode("sessions")}
                          className="text-indigo-600"
                        />
                        按節次加權累計 (複選節次累算)
                      </label>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200/80 flex flex-wrap items-center gap-4 text-xs">
                    {statsDateMode === "year" && (
                      <div className="flex items-center gap-2">
                        <label className="font-bold text-slate-600">選擇年份：</label>
                        <select
                          value={statsYear}
                          onChange={(e) => setStatsYear(e.target.value)}
                          className="px-3 py-1.5 rounded-lg border border-slate-300 bg-white font-mono font-bold focus:outline-none focus:ring-1 focus:ring-indigo-500"
                        >
                          <option value="2025">2025 年</option>
                          <option value="2026">2026 年</option>
                          <option value="2027">2027 年</option>
                        </select>
                      </div>
                    )}

                    {statsDateMode === "month" && (
                      <div className="flex items-center gap-2">
                        <label className="font-bold text-slate-600">選擇月份：</label>
                        <input
                          type="month"
                          value={statsMonth}
                          onChange={(e) => setStatsMonth(e.target.value)}
                          className="px-3 py-1.5 rounded-lg border border-slate-300 bg-white font-mono font-bold focus:outline-none focus:ring-1 focus:ring-indigo-500"
                        />
                      </div>
                    )}

                    {statsDateMode === "week" && (
                      <div className="flex items-center gap-2">
                        <label className="font-bold text-slate-600">選擇包含該週之任意日期：</label>
                        <input
                          type="date"
                          value={statsWeekBase}
                          onChange={(e) => setStatsWeekBase(e.target.value)}
                          className="px-3 py-1.5 rounded-lg border border-slate-300 bg-white font-mono font-bold focus:outline-none focus:ring-1 focus:ring-indigo-500"
                        />
                      </div>
                    )}

                    {statsDateMode === "custom" && (
                      <div className="flex flex-wrap items-center gap-2">
                        <label className="font-bold text-slate-600">起始日期：</label>
                        <input
                          type="date"
                          value={statsStartDate}
                          onChange={(e) => setStatsStartDate(e.target.value)}
                          className="px-3 py-1.5 rounded-lg border border-slate-300 bg-white font-mono font-bold focus:outline-none focus:ring-1 focus:ring-indigo-500"
                        />
                        <span className="text-slate-400 font-bold">～</span>
                        <label className="font-bold text-slate-600">結束日期：</label>
                        <input
                          type="date"
                          value={statsEndDate}
                          onChange={(e) => setStatsEndDate(e.target.value)}
                          className="px-3 py-1.5 rounded-lg border border-slate-300 bg-white font-mono font-bold focus:outline-none focus:ring-1 focus:ring-indigo-500"
                        />
                      </div>
                    )}

                    <div className="ml-auto font-mono text-indigo-800 bg-indigo-50 px-3 py-1 rounded-lg border border-indigo-100 font-semibold">
                      🗓️ 實際統計計算區間：<strong className="underline">{statsStartDate}</strong> 至 <strong className="underline">{statsEndDate}</strong>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="p-4 rounded-xl border border-indigo-100 bg-indigo-50/50 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-indigo-600 font-bold">區間內總預約筆數</p>
                      <p className="text-2xl font-black text-indigo-900 mt-0.5">{tabletUsageStats.totalReservationsInRange} <span className="text-xs font-normal text-indigo-700">筆預約</span></p>
                    </div>
                    <div className="p-3 bg-indigo-100 text-indigo-700 rounded-lg">
                      <i data-lucide="file-text" className="w-5 h-5"></i>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl border border-emerald-100 bg-emerald-50/50 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-emerald-600 font-bold">最高借用熱門設備編號</p>
                      <p className="text-xl font-black text-emerald-900 mt-0.5 font-mono">
                        {tabletUsageStats.topUsedDevice ? tabletUsageStats.topUsedDevice.code : "無紀錄"}
                      </p>
                      {tabletUsageStats.topUsedDevice && (
                        <p className="text-[11px] text-emerald-700">
                          累計借用：<strong>{tabletUsageStats.topUsedDevice.count}</strong> {statsCountMode === 'sessions' ? '節' : '次'}
                        </p>
                      )}
                    </div>
                    <div className="p-3 bg-emerald-100 text-emerald-700 rounded-lg">
                      <i data-lucide="flame" className="w-5 h-5"></i>
                    </div>
                  </div>

                  <div className="p-4 rounded-xl border border-amber-100 bg-amber-50/50 flex items-center justify-between">
                    <div>
                      <p className="text-xs text-amber-600 font-bold">未指派平板紀錄累計</p>
                      <p className="text-2xl font-black text-amber-900 mt-0.5">{tabletUsageStats.unassignedCount} <span className="text-xs font-normal text-amber-700">筆次未分配</span></p>
                    </div>
                    <div className="p-3 bg-amber-100 text-amber-700 rounded-lg">
                      <i data-lucide="alert-triangle" className="w-5 h-5"></i>
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl flex flex-col md:flex-row md:items-center justify-between gap-3 text-xs">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="font-bold text-slate-600">品牌類別過濾：</span>
                    {["ALL", "Surface Go", "iPad", "Chromebook", "Other"].map(cat => (
                      <button
                        key={cat}
                        onClick={() => setStatsCategoryFilter(cat)}
                        className={`px-2.5 py-1 rounded-lg transition font-medium ${
                          statsCategoryFilter === cat 
                            ? "bg-indigo-600 text-white shadow-sm" 
                            : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-100"
                        }`}
                      >
                        {cat === 'ALL' ? '全部類別' : cat}
                      </button>
                    ))}
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="relative">
                      <span className="absolute inset-y-0 left-0 flex items-center pl-2.5 text-slate-400">
                        <i data-lucide="search" className="w-3.5 h-3.5"></i>
                      </span>
                      <input
                        type="text"
                        placeholder="搜尋設備編號..."
                        value={statsSearch}
                        onChange={(e) => setStatsSearch(e.target.value)}
                        className="pl-8 pr-3 py-1 rounded-lg border border-slate-300 bg-white text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500"
                      />
                    </div>
                    <button
                      onClick={() => setStatsSortOrder(prev => prev === 'desc' ? 'asc' : 'desc')}
                      className="px-2.5 py-1 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 transition inline-flex items-center gap-1 font-semibold"
                    >
                      排序: {statsSortOrder === 'desc' ? '由高到低 ↓' : '由低到高 ↑'}
                    </button>
                  </div>
                </div>

                <div className="overflow-x-auto border border-slate-200 rounded-2xl">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <tr>
                        <th className="p-3">平板設備編號 / 代碼</th>
                        <th className="p-3">設備類別</th>
                        <th className="p-3 text-right">累計借用次數 ({statsCountMode === 'sessions' ? '節數' : '預約次數'})</th>
                        <th className="p-3">熱度視覺條</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-mono">
                      {tabletUsageStats.list.length > 0 ? (
                        tabletUsageStats.list.map((item, idx) => {
                          const maxCount = tabletUsageStats.list[0]?.count || 1;
                          const percentage = Math.round((item.count / Math.max(maxCount, 1)) * 100);

                          return (
                            <tr key={idx} className="hover:bg-slate-50 transition">
                              <td className="p-3 font-bold text-slate-800 text-sm">
                                {item.code}
                              </td>
                              <td className="p-3 font-sans">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                                  item.category === 'Surface Go' ? 'bg-blue-50 text-blue-700 border-blue-200' :
                                  item.category === 'iPad' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                  item.category === 'Chromebook' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                                  'bg-slate-50 text-slate-600 border-slate-200'
                                }`}>
                                  {item.category}
                                </span>
                              </td>
                              <td className="p-3 text-right font-black text-slate-900 text-sm">
                                {item.count}
                              </td>
                              <td className="p-3 font-sans w-1/3">
                                <div className="flex items-center gap-2">
                                  <div className="flex-1 h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                                    <div 
                                      className={`h-full transition-all duration-300 rounded-full ${
                                        percentage > 70 ? 'bg-indigo-600' :
                                        percentage > 30 ? 'bg-blue-500' :
                                        item.count > 0 ? 'bg-sky-400' : 'bg-slate-200'
                                      }`}
                                      style={{ width: `${percentage}%` }}
                                    ></div>
                                  </div>
                                  <span className="text-[10px] text-slate-400 w-8 text-right font-mono">{percentage}%</span>
                                </div>
                              </td>
                            </tr>
                          );
                        })
                      ) : (
                        <tr>
                          <td colSpan="4" className="p-8 text-center text-slate-400 font-sans">
                            無符合搜尋或篩選條件之平板設備
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

              </div>
            )}
          </main>

          {/* Modal 1: Login */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-100 shadow-2xl max-w-md w-full overflow-hidden animate-scaleIn">
                <div className="p-6 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="shield-check" className="text-indigo-600"></i>
                    管理者驗證登入
                  </h3>
                  <button 
                    onClick={() => setShowLoginModal(false)}
                    className="p-1 rounded-lg text-slate-400 hover:bg-slate-200 hover:text-slate-600 transition"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <form onSubmit={handleLoginSubmit} className="p-6 space-y-4">
                  {loginError && (
                    <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 font-bold flex items-center gap-2">
                      <i data-lucide="alert-circle" className="w-4 h-4 flex-shrink-0"></i>
                      {loginError}
                    </div>
                  )}
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-700">管理員帳號</label>
                    <input
                      type="text"
                      required
                      value={loginUser}
                      onChange={(e) => setLoginUser(e.target.value)}
                      placeholder="請輸入管理帳號"
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-700">管理員密碼</label>
                    <input
                      type="password"
                      required
                      value={loginPass}
                      onChange={(e) => setLoginPass(e.target.value)}
                      placeholder="請輸入管理密碼"
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>
                  <div className="pt-2 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowLoginModal(false)}
                      className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      disabled={isAuthLoading}
                      className="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700 shadow flex items-center gap-1.5"
                    >
                      {isAuthLoading && <i data-lucide="loader-2" className="w-3.5 h-3.5 animate-spin"></i>}
                      登入驗證
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal 2: Tablet Assign */}
          {tabletAssignModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-100 shadow-2xl max-w-lg w-full overflow-hidden animate-scaleIn flex flex-col max-h-[90vh]">
                <div className="p-6 bg-slate-50 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="tablet" className="text-indigo-600"></i>
                    指派 / 修改平板編號
                  </h3>
                  <button 
                    onClick={() => setTabletAssignModal(null)}
                    className="p-1 rounded-lg text-slate-400 hover:bg-slate-200 hover:text-slate-600 transition"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                
                <div className="p-6 space-y-4 overflow-y-auto">
                  <div className="p-3 bg-indigo-50/70 border border-indigo-100 rounded-xl space-y-1 text-xs">
                    <p className="font-bold text-indigo-900">預約資訊摘要：</p>
                    <p className="text-indigo-800">借用人：{tabletAssignModal.teacher} 老師 ({tabletAssignModal.grade})</p>
                    <p className="text-indigo-800">日期節次：{tabletAssignModal.date} [{tabletAssignModal.sessions.join(", ")}]</p>
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-700">當前分配之平板編號 (可多選點擊或手動輸入)</label>
                    <input
                      type="text"
                      value={tempTabletCode}
                      onChange={(e) => setTempTabletCode(e.target.value)}
                      placeholder="例如: (S)-A(1-30), (I)-B(1-30)"
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-300 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-slate-800"
                    />
                  </div>

                  <div className="space-y-3 pt-2">
                    <p className="text-xs font-bold text-slate-600">快速點選加入 / 移除常用設備代碼：</p>
                    
                    {/* Surface Go */}
                    <div className="space-y-1">
                      <p className="text-[11px] font-bold text-blue-600">Surface Go 系列 (全 16 組):</p>
                      <div className="flex flex-wrap gap-1.5">
                        {Surface_Go_CODES.map((code) => {
                          const isSelected = tempTabletCode.includes(code);
                          const isOccupied = occupiedTabletCodes.has(code);
                          return (
                            <button
                              key={code}
                              type="button"
                              disabled={isOccupied}
                              onClick={() => toggleTabletCodeSelect(code)}
                              className={`px-2 py-1 rounded text-[11px] font-mono transition font-semibold border ${
                                isOccupied
                                  ? "bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed line-through opacity-60"
                                  : isSelected
                                    ? "bg-blue-600 text-white border-blue-600 shadow-sm"
                                    : "bg-blue-50/60 text-blue-800 border-blue-200 hover:bg-blue-100"
                              }`}
                              title={isOccupied ? "同日期時段已被其他老師指派" : ""}
                            >
                              {code}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* iPad */}
                    <div className="space-y-1 pt-1">
                      <p className="text-[11px] font-bold text-emerald-600">iPad 系列 (全 7 組):</p>
                      <div className="flex flex-wrap gap-1.5">
                        {IPAD_CODES.map((code) => {
                          const isSelected = tempTabletCode.includes(code);
                          const isOccupied = occupiedTabletCodes.has(code);
                          return (
                            <button
                              key={code}
                              type="button"
                              disabled={isOccupied}
                              onClick={() => toggleTabletCodeSelect(code)}
                              className={`px-2 py-1 rounded text-[11px] font-mono transition font-semibold border ${
                                isOccupied
                                  ? "bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed line-through opacity-60"
                                  : isSelected
                                    ? "bg-emerald-600 text-white border-emerald-600 shadow-sm"
                                    : "bg-emerald-50/60 text-emerald-800 border-emerald-200 hover:bg-emerald-100"
                              }`}
                              title={isOccupied ? "同日期時段已被其他老師指派" : ""}
                            >
                              {code}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Chromebook */}
                    <div className="space-y-1 pt-1">
                      <p className="text-[11px] font-bold text-amber-600">Chromebook 系列 (全 2 組):</p>
                      <div className="flex flex-wrap gap-1.5">
                        {CHROMEBOOK_CODES.map((code) => {
                          const isSelected = tempTabletCode.includes(code);
                          const isOccupied = occupiedTabletCodes.has(code);
                          return (
                            <button
                              key={code}
                              type="button"
                              disabled={isOccupied}
                              onClick={() => toggleTabletCodeSelect(code)}
                              className={`px-2 py-1 rounded text-[11px] font-mono transition font-semibold border ${
                                isOccupied
                                  ? "bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed line-through opacity-60"
                                  : isSelected
                                    ? "bg-amber-600 text-white border-amber-600 shadow-sm"
                                    : "bg-amber-50/60 text-amber-800 border-amber-200 hover:bg-amber-100"
                              }`}
                              title={isOccupied ? "同日期時段已被其他老師指派" : ""}
                            >
                              {code}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2 flex-shrink-0">
                  <button
                    type="button"
                    onClick={() => setTabletAssignModal(null)}
                    className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-100"
                  >
                    取消
                  </button>
                  <button
                    type="button"
                    onClick={saveTabletAssign}
                    className="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-700 shadow flex items-center gap-1"
                  >
                    <i data-lucide="check" className="w-4 h-4"></i>
                    儲存平板指派
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 3: Delete Confirm */}
          {deleteConfirmModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-100 shadow-2xl max-w-sm w-full p-6 text-center space-y-4 animate-scaleIn">
                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                  <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                </div>
                <h3 className="text-base font-bold text-slate-800">確認取消此筆借用預約？</h3>
                <div className="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-200 text-left space-y-1">
                  <p><strong>借用人：</strong>{deleteConfirmModal.teacher} 老師</p>
                  <p><strong>日期：</strong>{deleteConfirmModal.date}</p>
                  <p><strong>時段：</strong>{deleteConfirmModal.sessions.join(", ")}</p>
                </div>
                <div className="flex items-center justify-center gap-3 pt-2">
                  <button
                    onClick={() => setDeleteConfirmModal(null)}
                    className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50"
                  >
                    保留預約
                  </button>
                  <button
                    onClick={confirmDelete}
                    className="px-5 py-2 rounded-xl bg-red-600 text-white text-xs font-semibold hover:bg-red-700 shadow"
                  >
                    確認取消刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal 4: CSV Export Option */}
          {showExportModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-100 shadow-2xl max-w-md w-full overflow-hidden animate-scaleIn">
                <div className="p-6 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="download" className="text-indigo-600"></i>
                    匯出預約明細 CSV 檔
                  </h3>
                  <button 
                    onClick={() => setShowExportModal(false)}
                    className="p-1 rounded-lg text-slate-400 hover:bg-slate-200 hover:text-slate-600 transition"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <div className="p-6 space-y-4 text-xs">
                  <div className="space-y-2">
                    <label className="font-bold text-slate-700 block">匯出範圍設定：</label>
                    <div className="space-y-2">
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input
                          type="radio"
                          name="exportRange"
                          checked={exportRangeType === "all"}
                          onChange={() => setExportRangeType("all")}
                          className="text-indigo-600 focus:ring-indigo-500"
                        />
                        <span>匯出目前全部搜尋結果 ({filteredReservations.length} 筆)</span>
                      </label>
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input
                          type="radio"
                          name="exportRange"
                          checked={exportRangeType === "custom"}
                          onChange={() => setExportRangeType("custom")}
                          className="text-indigo-600 focus:ring-indigo-500"
                        />
                        <span>自訂日期區間</span>
                      </label>
                    </div>
                  </div>

                  {exportRangeType === "custom" && (
                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                      <div>
                        <label className="text-slate-600 font-bold block mb-1">起始日期：</label>
                        <input
                          type="date"
                          value={customExportStart}
                          onChange={(e) => setCustomExportStart(e.target.value)}
                          className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-mono"
                        />
                      </div>
                      <div>
                        <label className="text-slate-600 font-bold block mb-1">結束日期：</label>
                        <input
                          type="date"
                          value={customExportEnd}
                          onChange={(e) => setCustomExportEnd(e.target.value)}
                          className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-mono"
                        />
                      </div>
                    </div>
                  )}

                  <div className="pt-2 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowExportModal(false)}
                      className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 font-semibold hover:bg-slate-50"
                    >
                      取消
                    </button>
                    <button
                      type="button"
                      onClick={executeCsvExport}
                      className="px-5 py-2 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700 shadow"
                    >
                      確認下載 CSV
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modal 5: Word Export Option */}
          {showWordExportModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-100 shadow-2xl max-w-md w-full overflow-hidden animate-scaleIn">
                <div className="p-6 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="file-text" className="text-blue-600"></i>
                    匯出週課表為 Word (.doc) 檔
                  </h3>
                  <button 
                    onClick={() => setShowWordExportModal(false)}
                    className="p-1 rounded-lg text-slate-400 hover:bg-slate-200 hover:text-slate-600 transition"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <div className="p-6 space-y-4 text-xs">
                  <div className="space-y-2">
                    <label className="font-bold text-slate-700 block">課表匯出範圍：</label>
                    <div className="space-y-2">
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input
                          type="radio"
                          name="wordExportType"
                          checked={wordExportType === "week"}
                          onChange={() => setWordExportType("week")}
                          className="text-indigo-600 focus:ring-indigo-500"
                        />
                        <span>僅匯出當前畫面瀏覽的這一週</span>
                      </label>
                      <label className="flex items-center gap-2 cursor-pointer">
                        <input
                          type="radio"
                          name="wordExportType"
                          checked={wordExportType === "custom"}
                          onChange={() => setWordExportType("custom")}
                          className="text-indigo-600 focus:ring-indigo-500"
                        />
                        <span>自訂多週起訖範圍 (多頁 Word 表格)</span>
                      </label>
                    </div>
                  </div>

                  {wordExportType === "custom" && (
                    <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                      <div>
                        <label className="text-slate-600 font-bold block mb-1">起始週 (任意日期)：</label>
                        <input
                          type="date"
                          value={wordCustomStart}
                          onChange={(e) => setWordCustomStart(e.target.value)}
                          className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-mono"
                        />
                      </div>
                      <div>
                        <label className="text-slate-600 font-bold block mb-1">結束週 (任意日期)：</label>
                        <input
                          type="date"
                          value={wordCustomEnd}
                          onChange={(e) => setWordCustomEnd(e.target.value)}
                          className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-mono"
                        />
                      </div>
                    </div>
                  )}

                  <div className="pt-2 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowWordExportModal(false)}
                      className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 font-semibold hover:bg-slate-50"
                    >
                      取消
                    </button>
                    <button
                      type="button"
                      onClick={executeWordExport}
                      className="px-5 py-2 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 shadow"
                    >
                      確認下載 Word
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          <footer className="bg-slate-900 text-slate-400 text-center py-6 text-xs border-t border-slate-800 mt-auto">
            <p>重慶國中 平板借用預約與設備管理系統 &copy; 2026</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
