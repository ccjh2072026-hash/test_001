<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平板借用預約系統 - 115學期</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
    }
    
    input[type="date"]::-webkit-calendar-picker-indicator {
      margin-left: 16px;
      cursor: pointer;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .locked-stripes {
      background-color: #f8fafc;
      background-image: repeating-linear-gradient(
        45deg,
        #f1f5f9,
        #f1f5f9 10px,
        #f8fafc 10px,
        #f8fafc 20px
      );
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const INITIAL_RESERVATIONS = [];
    const SESSIONS = [
      { name: "早自習", time: "7:30-8:10", group: "morning", bg: "bg-purple-50", text: "text-purple-700", border: "border-purple-200", classId: "morning", reservable: false },
      { name: "第一節", time: "8:15-9:00", group: "am", bg: "bg-blue-50/70", text: "text-blue-700", border: "border-blue-200", classId: "am", reservable: true },
      { name: "第二節", time: "9:10-9:55", group: "am", bg: "bg-blue-50/70", text: "text-blue-700", border: "border-blue-200", classId: "am", reservable: true },
      { name: "第三節", time: "10:05-10:50", group: "am", bg: "bg-blue-50/70", text: "text-blue-700", border: "border-blue-200", classId: "am", reservable: true },
      { name: "第四節", time: "11:00-11:45", group: "am", bg: "bg-blue-50/70", text: "text-blue-700", border: "border-blue-200", classId: "am", reservable: true },
      { name: "中午", time: "12:15-13:00", group: "noon", bg: "bg-amber-50/70", text: "text-amber-700", border: "border-amber-200", classId: "noon", reservable: true },
      { name: "第五節", time: "13:05-13:50", group: "pm", bg: "bg-rose-50/70", text: "text-rose-700", border: "border-rose-200", classId: "pm", reservable: true },
      { name: "第六節", time: "14:00-14:45", group: "pm", bg: "bg-rose-50/70", text: "text-rose-700", border: "border-rose-200", classId: "pm", reservable: true },
      { name: "第七節", time: "15:00-15:45", group: "pm", bg: "bg-rose-50/70", text: "text-rose-700", border: "border-rose-200", classId: "pm", reservable: true },
      { name: "第八節", time: "16:00-16:45", group: "evening", bg: "bg-emerald-50/70", text: "text-emerald-700", border: "border-emerald-200", classId: "evening", reservable: true }
    ];
    const PURPOSES = ["領域教學", "研習", "校定課程", "社團", "行政業務", "其他"];
    const WEEKDAYS_ZH = ["一", "二", "三", "四", "五", "六"];
    const Surface_Go_CODES = Array.from({ length: 16 }).map((_, i) => `(S)-${String.fromCharCode(65 + i)}(1-30)`);
    const IPAD_CODES = Array.from({ length: 7 }).map((_, i) => `(I)-${String.fromCharCode(66 + i)}(1-30)`);
    const CHROMEBOOK_CODES = ["(CB)-A(1-30)", "(CB)-B(1-30)"];

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function formatDate(date) {
      if (!date) return "";
      if (typeof date === 'string') return date;
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    const escapeCsv = (str) => `"${String(str || '').replace(/"/g, '""')}"`;

    function App() {
      const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyh8DxjuO5Ut4pxPf-PS2O8LTsZgZSTWHQQFa-GTkgRQDCrc4M1N2wKXBKscnALPdjZ2A/exec";
      const ADMIN_AUTH_URL = "https://script.google.com/macros/s/AKfycbw-b5R_dfCj7aZgDTqT4C7o1crFFPIvRP3SdpLG9A_vqhGpMh2t5NRsqDD5FYmQ1o53/exec";

      const [reservations, setReservations] = useState(() => {
        const saved = localStorage.getItem("ccjh_tablet_reservations_v6");
        return saved ? JSON.parse(saved) : INITIAL_RESERVATIONS;
      });
      const [isLoading, setIsLoading] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isAuthLoading, setIsAuthLoading] = useState(false);
      const [systemTitle, setSystemTitle] = useState(() => {
        const saved = localStorage.getItem("ccjh_tablet_system_title_v6");
        return saved ? saved : "115學年度校內平板借用預約";
      });
      const [systemSubtitle, setSystemSubtitle] = useState(() => {
        const saved = localStorage.getItem("ccjh_tablet_system_subtitle_v6");
        return saved ? saved : "🔔 提醒老師務必協助於課堂使用時拍照紀錄，並將相關照片、成果、成效評估等資料上傳。";
      });

      const DEFAULT_SEMESTER_START = "2026-07-01";
      const DEFAULT_SEMESTER_END = "2027-01-31";

      const [semesterStart] = useState(DEFAULT_SEMESTER_START);
      const [semesterEnd] = useState(DEFAULT_SEMESTER_END);
      
      const [isAdmin, setIsAdmin] = useState(false);
      const [isPrimaryAdmin, setIsPrimaryAdmin] = useState(false);
      
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginUser, setLoginUser] = useState("");
      const [loginPass, setLoginPass] = useState("");
      const [loginError, setLoginError] = useState("");
      const [activeTab, setActiveTab] = useState("book"); 
      
      const [selectedWeekStart, setSelectedWeekStart] = useState(() => getMonday(new Date()));
      const [searchTerm, setSearchTerm] = useState("");
      const [filterPurpose, setFilterPurpose] = useState("全部");
      
      const [formData, setFormData] = useState({
        email: "",
        teacher: "",
        purpose: "領域教學",
        dates: [formatDate(new Date())],
        grade: "",
        sessions: [],
        tabletCode: "",
        note: "" // ===== 新增：備註欄位狀態 =====
      });
      const [notification, setNotification] = useState(null);
      const [tabletAssignModal, setTabletAssignModal] = useState(null); 
      const [tempTabletCode, setTempTabletCode] = useState("");
      const [deleteConfirmModal, setDeleteConfirmModal] = useState(null);
      const [showExportModal, setShowExportModal] = useState(false);
      const [exportRangeType, setExportRangeType] = useState("all");
      const [customExportStart, setCustomExportStart] = useState("2026-07-01");
      const [customExportEnd, setCustomExportEnd] = useState("2027-01-31");
      const [showWordExportModal, setShowWordExportModal] = useState(false);
      const [wordExportType, setWordExportType] = useState("week");
      const [wordCustomStart, setWordCustomStart] = useState("2026-07-20");
      const [wordCustomEnd, setWordCustomEnd] = useState("2026-07-25");

      // 統計分頁 State
      const [statsDateMode, setStatsDateMode] = useState("year"); // year | month | week | custom
      const [statsYear, setStatsYear] = useState(() => new Date().getFullYear().toString());
      const [statsMonth, setStatsMonth] = useState(() => `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`);
      const [statsWeekBase, setStatsWeekBase] = useState(() => formatDate(new Date()));
      const [statsStartDate, setStatsStartDate] = useState("2026-01-01");
      const [statsEndDate, setStatsEndDate] = useState("2026-12-31");
      const [statsCountMode, setStatsCountMode] = useState("count"); 
      const [statsCategoryFilter, setStatsCategoryFilter] = useState("ALL"); 
      const [statsSearch, setStatsSearch] = useState("");
      const [statsSortOrder, setStatsSortOrder] = useState("desc");

      useEffect(() => {
        if (!isAdmin && (activeTab === "list" || activeTab === "stats")) {
          setActiveTab("book");
        }
      }, [isAdmin, activeTab]);

      // 根據模式動態更新統計的起訖日期
      useEffect(() => {
        if (statsDateMode === "year") {
          setStatsStartDate(`${statsYear}-01-01`);
          setStatsEndDate(`${statsYear}-12-31`);
        } else if (statsDateMode === "month") {
          if (statsMonth) {
            const [y, m] = statsMonth.split('-').map(Number);
            const lastDay = new Date(y, m, 0).getDate();
            setStatsStartDate(`${y}-${String(m).padStart(2, '0')}-01`);
            setStatsEndDate(`${y}-${String(m).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`);
          }
        } else if (statsDateMode === "week") {
          if (statsWeekBase) {
            const mon = getMonday(new Date(statsWeekBase));
            const sat = new Date(mon);
            sat.setDate(mon.getDate() + 5);
            setStatsStartDate(formatDate(mon));
            setStatsEndDate(formatDate(sat));
          }
        }
      }, [statsDateMode, statsYear, statsMonth, statsWeekBase]);

      const sessionOrderMap = useMemo(() => {
        const map = {};
        SESSIONS.forEach((s, idx) => {
          map[s.name] = idx;
        });
        return map;
      }, []);

      const showNotification = useCallback((message, type = "success") => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 4000);
      }, []);

      const handleAddDate = () => {
        if (formData.dates.length < 5) {
          setFormData(prev => ({
            ...prev,
            dates: [...prev.dates, formatDate(new Date())]
          }));
        }
      };

      const handleDateChange = (index, value) => {
        setFormData(prev => {
          const newDates = [...prev.dates];
          newDates[index] = value;
          return { ...prev, dates: newDates };
        });
      };

      const handleRemoveDate = (index) => {
        setFormData(prev => {
          if (prev.dates.length <= 1) return prev;
          const newDates = prev.dates.filter((_, i) => i !== index);
          return { ...prev, dates: newDates };
        });
      };

      const fetchReservationsFromGAS = useCallback(async () => {
        setIsSyncing(true);
        try {
          const res = await fetch(GAS_API_URL);
          if (!res.ok) throw new Error("網路回應錯誤");
          const data = await res.json();
          if (Array.isArray(data)) {
            const formatted = data.map((item, idx) => ({
              id: item.id || `gas_${idx}_${Date.now()}`,
              email: item.email || item['電子郵件'] || '',
              teacher: item.teacher || item['借用教師姓名'] || item['借用人'] || '',
              purpose: item.purpose || item['用途'] || '領域教學',
              date: item.date || item['借用日期'] || '',
              grade: item.grade || item['使用年級班級'] || item['班級'] || '',
              sessions: Array.isArray(item.sessions) 
                ? item.sessions 
                : (typeof item.sessions === 'string' ? item.sessions.split(',').map(s => s.trim()) : []),
              tabletCode: item.tabletCode || item['指派平板編號'] || '',
              note: item.note || item['備註'] || '' // ===== 新增：讀取 Apps Script 傳回的第 I 欄 (備註) =====
            })).reverse();
            
            setReservations(formatted);
          }
        } catch (err) {
          console.error("讀取 GAS 資料失敗:", err);
          showNotification("讀取線上預約紀錄失敗，已使用快取資料。", "error");
        } finally {
          setIsSyncing(false);
          setIsLoading(false);
        }
      }, [GAS_API_URL, showNotification]);

      useEffect(() => {
        fetchReservationsFromGAS();
      }, [fetchReservationsFromGAS]);

      useEffect(() => {
        localStorage.setItem("ccjh_tablet_reservations_v6", JSON.stringify(reservations));
      }, [reservations]);

      useEffect(() => {
        localStorage.setItem("ccjh_tablet_system_title_v6", systemTitle);
        document.title = systemTitle + " - 重慶國中";
      }, [systemTitle]);

      useEffect(() => {
        localStorage.setItem("ccjh_tablet_system_subtitle_v6", systemSubtitle);
      }, [systemSubtitle]);

      const currentWeekDays = useMemo(() => {
        return Array.from({ length: 6 }).map((_, i) => {
          const d = new Date(selectedWeekStart);
          d.setDate(selectedWeekStart.getDate() + i);
          return {
            dateStr: formatDate(d),
            dayZh: WEEKDAYS_ZH[i],
            monthDayStr: `${d.getMonth() + 1}/${d.getDate()}`,
            isToday: formatDate(d) === formatDate(new Date())
          };
        });
      }, [selectedWeekStart]);

      const changeWeek = (weeksOffset) => {
        const newDate = new Date(selectedWeekStart);
        newDate.setDate(selectedWeekStart.getDate() + weeksOffset * 7);
        setSelectedWeekStart(newDate);
      };

      const goToTodayWeek = () => {
        setSelectedWeekStart(getMonday(new Date()));
      };

      const handleWeekJump = (e) => {
        if (e.target.value) {
          setSelectedWeekStart(getMonday(new Date(e.target.value)));
        }
      };

      const handleCheckboxChange = (sessionName) => {
        setFormData(prev => {
          const alreadySelected = prev.sessions.includes(sessionName);
          if (!alreadySelected && prev.sessions.length >= 4) {
            showNotification("單次預約最多僅能勾選 4 個節次！", "error");
            return prev;
          }
          const newSessions = alreadySelected
            ? prev.sessions.filter(s => s !== sessionName)
            : [...prev.sessions, sessionName];
          return { ...prev, sessions: newSessions };
        });
      };

      const handleGradeChange = (e) => {
        const val = e.target.value;
        if (val === "其他") {
          setFormData(prev => ({ ...prev, grade: "其他" }));
          return;
        }
        let digitsOnly = val.replace(/\D/g, "");
        if (digitsOnly.length > 3) {
          digitsOnly = digitsOnly.slice(0, 3);
        }
        setFormData(prev => ({ ...prev, grade: digitsOnly }));
      };

      const handleCopyTeacherInfo = (res) => {
        setFormData(prev => ({
          ...prev,
          email: res.email || "",
          teacher: res.teacher || "",
          purpose: res.purpose || "領域教學"
        }));
        setActiveTab("book");
        showNotification(`已複製 ${res.teacher} 老師的資料（信箱、姓名、用途）至預約表單！`, "info");
      };

      const duplicateWarning = useMemo(() => {
        if (!formData.dates || formData.dates.length === 0 || formData.sessions.length === 0) return null;
        
        const conflicting = reservations.filter(res => {
          if (!formData.dates.includes(res.date)) return false;
          return res.sessions.some(s => formData.sessions.includes(s));
        });
        if (conflicting.length > 0) {
          return {
            message: `⚠️ 注意！您選擇的日期中，已由以下老師預約同節次：`,
            conflicts: conflicting.map(c => `${c.date} ${c.teacher} (${c.grade} / ${c.sessions.join(", ")})`)
          };
        }
        return null;
      }, [formData.dates, formData.sessions, reservations]);

      const occupiedTabletCodes = useMemo(() => {
        if (!tabletAssignModal) return new Set();
        const occupied = new Set();
        reservations.forEach(r => {
          if (r.id === tabletAssignModal.id) return;
          if (r.date === tabletAssignModal.date) {
            const hasOverlappingSession = r.sessions.some(s => tabletAssignModal.sessions.includes(s));
            if (hasOverlappingSession && r.tabletCode) {
              const codes = r.tabletCode.split(',').map(c => c.trim()).filter(Boolean);
              codes.forEach(c => occupied.add(c));
            }
          }
        });
        return occupied;
      }, [tabletAssignModal, reservations]);

      const toggleTabletCodeSelect = (code) => {
        if (occupiedTabletCodes.has(code)) return;

        let currentCodes = tempTabletCode
          .split(',')
          .map(c => c.trim())
          .filter(Boolean);

        if (currentCodes.includes(code)) {
          currentCodes = currentCodes.filter(c => c !== code);
        } else {
          currentCodes.push(code);
        }
        setTempTabletCode(currentCodes.join(', '));
      };

      const handleQuickBook = (dateStr, sessionName) => {
        if (new Date(dateStr) < new Date(semesterStart) || new Date(dateStr) > new Date(semesterEnd)) {
          showNotification(`該日期不在目前設定的學期預約範圍內 (${semesterStart} ~ ${semesterEnd})！`, "error");
          return;
        }
        setFormData(prev => ({
          ...prev,
          dates: [dateStr],
          sessions: [sessionName]
        }));
        setActiveTab("book");
        showNotification(`已預填借用日期：${dateStr} 與 使用節次：${sessionName}！`, "info");
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (isSubmitting) return;
        
        if (!formData.email.trim()) return showNotification("請填寫電子郵件", "error");
        if (!formData.teacher.trim()) return showNotification("請填寫借用教師姓名", "error");
        if (!formData.grade.trim()) return showNotification("請填寫使用年級與班級", "error");
        if (formData.sessions.length === 0) return showNotification("請至少選擇一個使用節次", "error");
        if (formData.dates.length === 0) return showNotification("請至少選擇一個借用日期", "error");

        for (const d of formData.dates) {
          if (!d) return showNotification("借用日期不得為空", "error");
          if (new Date(d) < new Date(semesterStart) || new Date(d) > new Date(semesterEnd)) {
            return showNotification(`日期 ${d} 超出該學期可借用區間！目前範圍：${semesterStart} 至 ${semesterEnd}`, "error");
          }
        }

        if (formData.sessions.includes("早自習")) {
          return showNotification("「早自習」時段不開放預約借用！", "error");
        }

        setIsSubmitting(true);

        const sortedSessions = [...formData.sessions].sort(
          (a, b) => (sessionOrderMap[a] ?? 99) - (sessionOrderMap[b] ?? 99)
        );

        const newReservations = formData.dates.map((d, index) => ({
          id: 'res_' + Date.now() + '_' + index,
          email: formData.email,
          teacher: formData.teacher,
          purpose: formData.purpose,
          date: d,
          grade: formData.grade,
          sessions: sortedSessions,
          tabletCode: formData.tabletCode,
          note: formData.note || "" // ===== 新增：打包傳送備註給後端 =====
        }));

        showNotification(`正在傳送 ${newReservations.length} 筆預約資料，請稍候...`, "info");
        try {
          await Promise.all(
            newReservations.map(resObj =>
              fetch(GAS_API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                  "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(resObj)
              })
            )
          );

          setReservations(prev => [...newReservations, ...prev]);
          showNotification(`預約借用成功！已同步產生 ${newReservations.length} 筆獨立預約紀錄並登錄至 Google 試算表。`);
          
          setFormData({
            email: "",
            teacher: "",
            purpose: "領域教學",
            dates: [formatDate(new Date())],
            grade: "",
            sessions: [],
            tabletCode: "",
            note: "" // ===== 新增：送出後重置備註欄位 =====
          });

          if (isAdmin) {
            setActiveTab("list");
          } else {
            setActiveTab("timetable");
          }
        } catch (error) {
          console.error("回存 GAS 失敗:", error);
          showNotification("連線 Google 服務失敗，請檢查網路或稍後再試！", "error");
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleAdminToggle = () => {
        if (isAdmin) {
          setIsAdmin(false);
          setIsPrimaryAdmin(false);
          showNotification("已登出管理員模式。", "info");
        } else {
          setLoginError("");
          setShowLoginModal(true);
        }
      };

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        if (!loginUser.trim() || !loginPass.trim()) {
          setLoginError("請輸入帳號與密碼！");
          return;
        }

        setIsAuthLoading(true);
        setLoginError("");

        try {
          const response = await fetch(ADMIN_AUTH_URL, {
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              username: loginUser.trim(),
              password: loginPass.trim()
            })
          });

          const result = await response.json();

          if (result.success || result.status === "success" || result.authenticated) {
            setIsAdmin(true);
            
            const isFirst = result.isPrimary === true || 
                            result.isFirstAccount === true || 
                            result.order === 1 || 
                            result.index === 0 ||
                            loginUser.trim().toLowerCase() === "admin";

            setIsPrimaryAdmin(isFirst);
            setShowLoginModal(false);
            setLoginUser("");
            setLoginPass("");
            
            if (isFirst) {
              showNotification("主管理員登入成功！已啟用刪除紀錄與設備指派完整權限。", "success");
            } else {
              showNotification("管理員登入成功！僅啟用設備分派權限，無法刪除紀錄。", "info");
            }
          } else {
            setLoginError(result.message || "帳號或密碼錯誤！請重新確認。");
          }
        } catch (error) {
          console.error("驗證失敗:", error);
          setLoginError("後端驗證失敗或網路連線錯誤，請稍後再試。");
        } finally {
          setIsAuthLoading(false);
        }
      };

      const requestDelete = (res) => {
        if (!isAdmin) {
          showNotification("取消預約功能限管理員使用，請先登入管理員帳號！", "error");
          setShowLoginModal(true);
          return;
        }
        if (!isPrimaryAdmin) {
          showNotification("權限不足！只有第一筆資料之主要管理者才可刪除預約紀錄。", "error");
          return;
        }
        setDeleteConfirmModal(res);
      };

      const confirmDelete = async () => {
        if (!deleteConfirmModal) return;

        const targetRes = deleteConfirmModal;
        showNotification("正在將取消預約同步至後端，請稍候...", "info");

        try {
          await fetch(GAS_API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
              action: "delete",
              id: targetRes.id,
              teacher: targetRes.teacher,
              date: targetRes.date,
              sessions: targetRes.sessions
            })
          });

          setReservations(prev => prev.filter(r => r.id !== targetRes.id));
          showNotification(`已成功取消 ${targetRes.teacher} 老師的預約並同步至試算表！`);
        } catch (error) {
          console.error("同步 GAS 刪除預約失敗:", error);
          showNotification("後端同步失敗，已於前端先行移除，請檢查網路或試算表狀態。", "error");
        } finally {
          setDeleteConfirmModal(null);
        }
      };

      const openTabletAssign = (res) => {
        if (!isAdmin) {
          showNotification("指派平板功能限管理員使用，請先登入！", "error");
          setShowLoginModal(true);
          return;
        }
        setTabletAssignModal(res);
        setTempTabletCode(res.tabletCode || "");
      };

      const saveTabletAssign = async () => {
        if (!tabletAssignModal) return;

        const updatedRecord = {
          ...tabletAssignModal,
          tabletCode: tempTabletCode,
          action: "updateTabletCode"
        };

        showNotification("平板編號更新中，請稍候...", "info");

        try {
          await fetch(GAS_API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(updatedRecord)
          });

          setReservations(prev => prev.map(r => {
            if (r.id === tabletAssignModal.id) {
              return { ...r, tabletCode: tempTabletCode };
            }
            return r;
          }));

          showNotification(`成功指派平板編號為: ${tempTabletCode || '未指派'}`);
          setTabletAssignModal(null);
        } catch (error) {
          console.error("同步 GAS 平板編號失敗:", error);
          showNotification("連線 Google 服務失敗，請檢查網路或稍後再試！", "error");
        }
      };

      const filteredReservations = useMemo(() => {
        return reservations.filter(res => {
          const matchSearch = 
            res.teacher.toLowerCase().includes(searchTerm.toLowerCase()) ||
            res.grade.toLowerCase().includes(searchTerm.toLowerCase()) ||
            res.purpose.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (res.tabletCode && res.tabletCode.toLowerCase().includes(searchTerm.toLowerCase())) ||
            res.date.includes(searchTerm);
          
          const matchPurpose = filterPurpose === "全部" || res.purpose === filterPurpose;
          return matchSearch && matchPurpose;
        });
      }, [reservations, searchTerm, filterPurpose]);

      const handleCsvExport = () => {
        if (!isAdmin) {
          showNotification("匯出資料屬於管理員專屬功能，請先登入！", "error");
          setShowLoginModal(true);
          return;
        }
        setExportRangeType("all");
        setCustomExportStart(semesterStart);
        setCustomExportEnd(semesterEnd);
        setShowExportModal(true);
      };

      const executeCsvExport = () => {
        let exportData = filteredReservations;
        
        if (exportRangeType === "custom") {
          const start = new Date(customExportStart);
          const end = new Date(customExportEnd);
          exportData = filteredReservations.filter(r => {
            const d = new Date(r.date);
            return d >= start && d <= end;
          });
        }
        if (exportData.length === 0) {
          showNotification("所選區間內無任何預約資料！", "error");
          return;
        }
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
        csvContent += "用途,借用日期,使用節次,使用年級班級,指派平板編號,借用人郵件,借用人姓名\r\n";
        
        exportData.forEach(r => {
          const row = [
            escapeCsv(r.purpose),
            escapeCsv(r.date),
            escapeCsv(r.sessions.join(', ')),
            escapeCsv(r.grade),
            escapeCsv(r.tabletCode || ''),
            escapeCsv(r.email),
            escapeCsv(r.teacher)
          ].join(",");
          csvContent += row + "\r\n";
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `CCJH_Tablets_Filtered_${formatDate(new Date())}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setShowExportModal(false);
        showNotification(`成功匯出 ${exportData.length} 筆資料為 CSV 檔！`);
      };

      const handleWordExportClick = () => {
        if (!isAdmin) {
          showNotification("課表匯出屬於管理員專屬功能，請先登入！", "error");
          setShowLoginModal(true);
          return;
        }
        setWordExportType("week");
        setWordCustomStart(formatDate(selectedWeekStart));
        
        const sat = new Date(selectedWeekStart);
        sat.setDate(selectedWeekStart.getDate() + 5);
        setWordCustomEnd(formatDate(sat));
        setShowWordExportModal(true);
      };

      const executeWordExport = () => {
        let weeksToExport = [];
        if (wordExportType === "week") {
          weeksToExport.push({
            start: new Date(selectedWeekStart),
            end: new Date(selectedWeekStart.getTime() + 5 * 24 * 60 * 60 * 1000)
          });
        } else {
          let current = getMonday(new Date(wordCustomStart));
          const limit = new Date(wordCustomEnd);
          while (current <= limit) {
            const endOfWeek = new Date(current);
            endOfWeek.setDate(current.getDate() + 5);
            weeksToExport.push({
              start: new Date(current),
              end: endOfWeek
            });
            current.setDate(current.getDate() + 7);
          }
        }
        if (weeksToExport.length === 0) {
          showNotification("無有效的匯出時間範圍設定！", "error");
          return;
        }
        let docHtml = `
          <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
          <head>
            <meta charset='utf-8'>
            <title>重慶國中平板臨時借用預約狀況</title>
            <style>
              body { font-family: Arial, "Microsoft JhengHei", sans-serif; padding: 20px; color: #333; }
              .header { text-align: center; margin-bottom: 30px; }
              .header h1 { font-size: 18pt; font-weight: bold; margin-bottom: 5px; color: #1e3a8a; }
              .header p { font-size: 10pt; color: #666; margin: 0; }
              .table-container { margin-bottom: 40px; page-break-after: always; }
              .table-title { font-size: 12pt; font-weight: bold; margin-bottom: 10px; color: #2563eb; }
              table { width: 100%; border-collapse: collapse; border: 1.5px solid #475569; margin-bottom: 20px; }
              th, td { border: 1px solid #94a3b8; padding: 6px; font-size: 9.5pt; text-align: center; vertical-align: middle; }
              th { background-color: #f1f5f9; font-weight: bold; color: #1e293b; height: 35px; }
              .sidebar-header { background-color: #f8fafc; font-weight: bold; width: 110px; }
              .morning-bg { background-color: #f3e8ff; }
              .am-bg { background-color: #dbeafe; }
              .noon-bg { background-color: #fef3c7; }
              .pm-bg { background-color: #ffe4e6; }
              .evening-bg { background-color: #d1fae5; }
              .card { border: 1px solid #cbd5e1; background-color: #ffffff; padding: 4px; border-radius: 4px; font-size: 8.5pt; text-align: left; margin: 2px 0; }
              .card-title { font-weight: bold; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 2px; margin-bottom: 2px; }
              .card-detail { color: #475569; }
              .lock-text { color: #94a3b8; font-style: italic; font-size: 8.5pt; }
            </style>
          </head>
          <body>
            <div class='header'>
              <h1>重慶國中 平板借用課表統計表</h1>
              <p>系統自動導出檔 - 匯出日期: ${formatDate(new Date())}</p>
            </div>
        `;
        weeksToExport.forEach((weekRange, index) => {
          const daysOfWeek = Array.from({ length: 6 }).map((_, i) => {
            const d = new Date(weekRange.start);
            d.setDate(weekRange.start.getDate() + i);
            return {
              dateStr: formatDate(d),
              dayZh: WEEKDAYS_ZH[i],
              monthDayStr: `${d.getMonth() + 1}/${d.getDate()}`
            };
          });
          const titleStr = `週預約排程課表: ${formatDate(weekRange.start)} (一) 至 ${formatDate(daysOfWeek[5].dateStr)} (六)`;
          docHtml += `
            <div class='table-container' ${index === weeksToExport.length - 1 ? "style='page-break-after: avoid;'" : ""}>
              <div class='table-title'>${titleStr}</div>
              <table>
                <thead>
                  <tr>
                    <th>節次 / 時間</th>
                    ${daysOfWeek.map(day => `<th>週${day.dayZh}<br/><span style='font-size: 8pt; font-weight:normal;'>${day.monthDayStr}</span></th>`).join('')}
                  </tr>
                </thead>
                <tbody>
          `;
          SESSIONS.forEach(session => {
            let sessionBgClass = "";
            if (session.group === "morning") sessionBgClass = "morning-bg";
            if (session.group === "am") sessionBgClass = "am-bg";
            if (session.group === "noon") sessionBgClass = "noon-bg";
            if (session.group === "pm") sessionBgClass = "pm-bg";
            if (session.group === "evening") sessionBgClass = "evening-bg";
            docHtml += `<tr>`;
            docHtml += `<td class='sidebar-header ${sessionBgClass}'>${session.name}<br/><span style='font-size:7.5pt; font-weight:normal; color:#475569;'>${session.time}</span></td>`;
            daysOfWeek.forEach(day => {
              const cellReservations = reservations.filter(res => 
                res.date === day.dateStr && 
                res.sessions.includes(session.name) &&
                (isAdmin || (res.tabletCode && res.tabletCode.trim() !== ""))
              );
              docHtml += `<td>`;
              if (cellReservations.length > 0) {
                cellReservations.forEach(res => {
                  docHtml += `
                    <div class='card'>
                      <div class='card-title'>🏫 班級: ${res.grade}</div>
                      <div class='card-detail'>
                        <b>👤 老師:</b> ${res.teacher}<br/>
                        <b>🏷️ 平板編號:</b> ${res.tabletCode || '⚠️ 未指派'}
                      </div>
                    </div>
                  `;
                });
              } else if (!session.reservable) {
                docHtml += `<span class='lock-text'>🔒 不開放</span>`;
              } else {
                docHtml += `<span style='color: #cbd5e1; font-size: 8pt;'>-</span>`;
              }
              docHtml += `</td>`;
            });
            docHtml += `</tr>`;
          });
          docHtml += `
                </tbody>
              </table>
            </div>
          `;
        });
        docHtml += `
          </body>
          </html>
        `;
        const blob = new Blob(['\ufeff' + docHtml], { type: 'application/msword;charset=utf-8' });
        const url = URL.ObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `CCJH_Tablet_Weekly_Schedule_${formatDate(new Date())}.doc`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        setShowWordExportModal(false);
        showNotification("平板課表 Word 文件 (.doc) 產生並下載成功！可在 Microsoft Word 或 Google Docs 完美相容開啟。");
      };

      const stats = useMemo(() => {
        const total = reservations.length;
        const todayStr = formatDate(new Date());
        
        const unassigned = reservations.filter(r => 
          (!r.tabletCode || r.tabletCode.trim() === "") && r.date >= todayStr
        ).length;
        
        const upcoming = reservations.filter(r => new Date(r.date) >= new Date()).length;
        
        const teacherCounts = {};
        reservations.forEach(r => {
          teacherCounts[r.teacher] = (teacherCounts[r.teacher] || 0) + 1;
        });
        const activeTeacher = Object.entries(teacherCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || "無";
        return { total, unassigned, upcoming, activeTeacher };
      }, [reservations]);

      // 平板次數統計邏輯
      const tabletUsageStats = useMemo(() => {
        const counts = {};
        let unassignedCount = 0;
        let totalAssignedUsages = 0;

        const filteredByDate = reservations.filter(r => {
          if (!r.date) return false;
          return r.date >= statsStartDate && r.date <= statsEndDate;
        });

        filteredByDate.forEach(r => {
          const multiplier = statsCountMode === "sessions" ? (r.sessions ? r.sessions.length : 1) : 1;
          
          if (!r.tabletCode || r.tabletCode.trim() === "") {
            unassignedCount += multiplier;
          } else {
            const codes = r.tabletCode.split(',').map(c => c.trim()).filter(Boolean);
            if (codes.length === 0) {
              unassignedCount += multiplier;
            } else {
              codes.forEach(code => {
                counts[code] = (counts[code] || 0) + multiplier;
                totalAssignedUsages += multiplier;
              });
            }
          }
        });

        const allKnownCodes = [
          ...Surface_Go_CODES,
          ...IPAD_CODES,
          ...CHROMEBOOK_CODES,
          ...Object.keys(counts)
        ];
        const uniqueCodes = Array.from(new Set(allKnownCodes));

        let list = uniqueCodes.map(code => {
          let category = "Other";
          if (code.includes("(S)-")) category = "Surface Go";
          else if (code.includes("(I)-")) category = "iPad";
          else if (code.includes("(CB)-")) category = "Chromebook";

          return {
            code,
            category,
            count: counts[code] || 0
          };
        });

        if (statsCategoryFilter !== "ALL") {
          list = list.filter(item => item.category === statsCategoryFilter);
        }

        if (statsSearch.trim()) {
          const q = statsSearch.trim().toLowerCase();
          list = list.filter(item => item.code.toLowerCase().includes(q));
        }

        list.sort((a, b) => {
          if (statsSortOrder === "desc") {
            return b.count - a.count || a.code.localeCompare(b.code);
          } else {
            return a.count - b.count || a.code.localeCompare(b.code);
          }
        });

        const topUsedDevice = list.filter(i => i.count > 0)[0] || null;

        return {
          list,
          unassignedCount,
          totalAssignedUsages,
          totalReservationsInRange: filteredByDate.length,
          topUsedDevice
        };
      }, [reservations, statsStartDate, statsEndDate, statsCountMode, statsCategoryFilter, statsSearch, statsSortOrder]);

      const handleExportTabletStatsCsv = () => {
        if (tabletUsageStats.list.length === 0) {
          showNotification("當前無可匯出的統計資料！", "error");
          return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += `平板借用次數統計表 (${statsStartDate} ~ ${statsEndDate})\r\n`;
        csvContent += `計算維度: ${statsCountMode === 'sessions' ? '按使用節次加權累計' : '按預約借用次數累計'}\r\n\r\n`;
        csvContent += "平板代碼/編號,設備類別,累計借用次數/節數\r\n";

        tabletUsageStats.list.forEach(item => {
          const categoryName = item.category === 'Surface Go' ? '三星系列' : item.category === 'iPad' ? 'iPad系列' : item.category === 'Chromebook' ? 'Chromebook系列' : '其他系列';
          csvContent += `${escapeCsv(item.code)},${escapeCsv(categoryName)},${item.count}\r\n`;
        });

        csvContent += `\r\n未指派編號紀錄累計,未知,${tabletUsageStats.unassignedCount}\r\n`;

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Tablet_Usage_Stats_${statsStartDate}_to_${statsEndDate}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showNotification("平板次數統計報表 (CSV) 下載成功！");
      };

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, isLoading, reservations, isSyncing, formData.dates, statsDateMode, tabletUsageStats, isAdmin]);

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-gradient-to-r from-purple-700 via-indigo-800 to-blue-800 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-6 md:py-8">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div className="flex-1">
                  <div className="inline-flex items-center gap-2 bg-white/20 text-white text-xs font-semibold px-3 py-1 rounded-full backdrop-blur-sm mb-2">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    國中校內資訊設備管理平台
                    {isSyncing && (
                      <span className="text-[10px] bg-white/30 px-2 py-0.5 rounded text-indigo-100 flex items-center gap-1">
                        <i data-lucide="refresh-cw" className="w-3 h-3 animate-spin"></i> 背景同步中
                      </span>
                    )}
                  </div>
                  
                  <h1 className="text-2xl md:text-3xl font-bold tracking-tight flex items-center gap-2">
                    {systemTitle}
                  </h1>
                  
                  <div className="text-purple-100 text-xs md:text-sm mt-1 max-w-3xl flex items-start gap-2">
                    <p className="flex-1 leading-relaxed whitespace-pre-line">{systemSubtitle}</p>
                  </div>
                </div>
                
                <div className="flex flex-col md:flex-row items-stretch md:items-center gap-3">
                  <div className="flex items-center gap-3 bg-white/10 p-2.5 rounded-xl border border-white/20 backdrop-blur-md">
                    <div className="flex items-center gap-2">
                      <span className={`p-1.5 rounded-md ${isAdmin ? (isPrimaryAdmin ? 'bg-emerald-500 text-white animate-pulse' : 'bg-blue-500 text-white') : 'bg-white/15 text-white/70'}`}>
                        <i data-lucide={isAdmin ? "shield-check" : "lock"} className="w-4 h-4"></i>
                      </span>
                      <div className="text-left pr-2">
                        <p className="text-[11px] font-bold text-white/90 leading-tight">管理權限模式</p>
                        <p className="text-[10px] text-white/60 leading-none">
                          {isAdmin 
                            ? (isPrimaryAdmin ? "主要管理者 (完整權限)" : "次要管理者 (僅分派權限)") 
                            : "需登入以編輯平板"}
                        </p>
                      </div>
                    </div>
                    <button 
                      onClick={handleAdminToggle}
                      className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all duration-200 ${
                        isAdmin 
                          ? "bg-amber-400 text-slate-950 shadow-md shadow-amber-500/20 hover:bg-amber-300"
                          : "bg-white/20 text-white hover:bg-white/30"
                      }`}
                    >
                      {isAdmin ? "登出管理" : "管理者登入"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </header>

          {notification && (
            <div className={`fixed top-4 right-4 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-0 ${
              notification.type === "error" ? "bg-red-50 text-red-800 border-l-4 border-red-500" :
              notification.type === "info" ? "bg-blue-50 text-blue-800 border-l-4 border-blue-500" :
              "bg-emerald-50 text-emerald-800 border-l-4 border-emerald-500"
            }`}>
              <i data-lucide={notification.type === "error" ? "alert-circle" : "check-circle-2"} className="w-5 h-5 flex-shrink-0"></i>
              <span className="text-sm font-medium">{notification.message}</span>
            </div>
          )}

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:py-6">
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div className="p-3 rounded-lg bg-indigo-50 text-indigo-600">
                  <i data-lucide="tablet" className="w-6 h-6"></i>
                </div>
                <div>
                  <p className="text-xs text-slate-500">總平板預約借用次數</p>
                  <p className="text-xl font-bold text-slate-800">
                    {stats.total} 筆紀錄
                  </p>
                </div>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div className="p-3 rounded-lg bg-red-50 text-red-600">
                  <i data-lucide="alert-octagon" className="w-6 h-6"></i>
                </div>
                <div>
                  <p className="text-xs text-slate-500">未指派平板編號</p>
                  <p className="text-xl font-bold text-red-600">
                    {stats.unassigned} 筆待指派
                  </p>
                </div>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div className="p-3 rounded-lg bg-emerald-50 text-emerald-600">
                  <i data-lucide="calendar" className="w-6 h-6"></i>
                </div>
                <div>
                  <p className="text-xs text-slate-500">學期預約可借區間</p>
                  <p className="text-[11px] font-bold text-emerald-800 leading-tight">
                    {semesterStart.replace(/-/g, "/")} ~ {semesterEnd.replace(/-/g, "/")}
                  </p>
                </div>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div className="p-3 rounded-lg bg-purple-50 text-purple-600">
                  <i data-lucide="award" className="w-6 h-6"></i>
                </div>
                <div>
                  <p className="text-xs text-slate-500">最熱門平板借用教師</p>
                  <p className="text-xl font-bold text-slate-800">{stats.activeTeacher} 老師</p>
                </div>
              </div>
            </div>

            {/* TAB Navigation Bar */}
            <div className="flex border-b border-slate-200 mb-6 bg-white p-1 rounded-xl shadow-sm gap-1 overflow-x-auto">
              <button
                onClick={() => setActiveTab("book")}
                className={`flex-1 md:flex-initial flex items-center justify-center gap-2 px-5 py-3 rounded-lg text-sm font-semibold transition-all duration-150 whitespace-nowrap ${
                  activeTab === "book"
                    ? "bg-indigo-600 text-white shadow-sm"
                    : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"
                }`}
              >
                <i data-lucide="file-plus-2" className="w-4 h-4"></i>
                填寫預約表單
              </button>

              <button
                onClick={() => setActiveTab("timetable")}
                className={`flex-1 md:flex-initial flex items-center justify-center gap-2 px-5 py-3 rounded-lg text-sm font-semibold transition-all duration-150 whitespace-nowrap ${
                  activeTab === "timetable"
                    ? "bg-indigo-600 text-white shadow-sm"
                    : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"
                }`}
              >
                <i data-lucide="calendar-range" className="w-4 h-4"></i>
                一週預約狀況課表
              </button>
              
              {isAdmin && (
                <button
                  onClick={() => setActiveTab("list")}
                  className={`flex-1 md:flex-initial flex items-center justify-center gap-2 px-5 py-3 rounded-lg text-sm font-semibold transition-all duration-150 whitespace-nowrap ${
                    activeTab === "list"
                      ? "bg-indigo-600 text-white shadow-sm"
                      : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"
                  }`}
                >
                  <i data-lucide="list-collapse" className="w-4 h-4"></i>
                  預約明細紀錄表
                  {stats.unassigned > 0 && (
                    <span className="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full ml-1 font-bold">
                      {stats.unassigned}
                    </span>
                  )}
                </button>
              )}

              {isAdmin && (
                <button
                  onClick={() => setActiveTab("stats")}
                  className={`flex-1 md:flex-initial flex items-center justify-center gap-2 px-5 py-3 rounded-lg text-sm font-semibold transition-all duration-150 whitespace-nowrap ${
                    activeTab === "stats"
                      ? "bg-indigo-600 text-white shadow-sm"
                      : "text-slate-600 hover:bg-slate-100 hover:text-slate-900"
                  }`}
                >
                  <i data-lucide="bar-chart-3" className="w-4 h-4"></i>
                  平板借用統計
                </button>
              )}
            </div>

            {/* TAB 1: BOOK FORM */}
            {activeTab === "book" && (
              <div className="max-w-3xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-lg overflow-hidden transition-all duration-200 animate-fadeIn">
                <div className="h-2 bg-gradient-to-r from-purple-500 via-indigo-500 to-blue-500"></div>
                <div className="p-6 md:p-8 border-b border-slate-100 bg-slate-50/50">
                  <h2 className="text-xl md:text-2xl font-extrabold text-slate-800 flex items-center gap-2">
                    <i data-lucide="calendar-plus" className="text-indigo-600"></i>
                    校內平板臨時借用預約單
                  </h2>
                  <p className="text-slate-500 text-xs mt-1.5">
                    請填寫基本預約資訊。<br /><strong className="text-indigo-600">目前可預約之學期日期限制為：{semesterStart}</strong> ~ <strong className="text-indigo-600">{semesterEnd}</strong>。
                  </p>
                </div>
                <form onSubmit={handleSubmit} className="p-6 md:p-8 space-y-6">
                  <div className="space-y-1.5">
                    <label className="block text-sm font-bold text-slate-700">
                      電子郵件 <span className="text-red-500">*</span>
                    </label>
                    <input
                      type="email"
                      required
                      placeholder="您的教育公務信箱 (例如: username@ccjh.ntpc.edu.tw)"
                      value={formData.email}
                      onFocus={(e) => {
                        if (!formData.email) {
                          setFormData(prev => ({ ...prev, email: "@ccjh.ntpc.edu.tw" }));
                          setTimeout(() => {
                            e.target.setSelectionRange(0, 0);
                          }, 0);
                        }
                      }}
                      onChange={(e) => setFormData(prev => ({ ...prev, email: e.target.value }))}
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 text-sm"
                    />
                  </div>
                  <div className="space-y-1.5">
                    <label className="block text-sm font-bold text-slate-700">
                      借用教師姓名 <span className="text-red-500">*</span>
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="請輸入借用人姓名 (例如: 何呂升)"
                      value={formData.teacher}
                      onChange={(e) => setFormData(prev => ({ ...prev, teacher: e.target.value }))}
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 text-sm"
                    />
                  </div>
                  <div className="space-y-1.5">
                    <label className="block text-sm font-bold text-slate-700">
                      用途 <span className="text-red-500">*</span>
                    </label>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                      {PURPOSES.map((p, idx) => (
                        <label 
                          key={idx}
                          className={`flex items-center gap-2.5 p-3 rounded-xl border cursor-pointer transition ${
                            formData.purpose === p 
                              ? "border-indigo-500 bg-indigo-50/50 text-indigo-900 font-semibold" 
                              : "border-slate-200 hover:bg-slate-50 text-slate-600"
                          }`}
                        >
                          <input
                            type="radio"
                            name="purpose"
                            value={p}
                            checked={formData.purpose === p}
                            onChange={(e) => setFormData(prev => ({ ...prev, purpose: e.target.value }))}
                            className="text-indigo-600 focus:ring-indigo-500 h-4 w-4"
                          />
                          <span className="text-sm">{p}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                  
                  <div className="space-y-1.5">
                    <label className="block text-sm font-bold text-slate-700">
                      借用日期 <span className="text-red-500">*</span>
                    </label>
                    <div className="flex flex-wrap gap-2 items-center">
                      {formData.dates.map((dateVal, index) => (
                        <div key={index} className="flex items-center gap-1">
                          <input
                            type="date"
                            required
                            min={semesterStart}
                            max={semesterEnd}
                            value={dateVal}
                            onChange={(e) => handleDateChange(index, e.target.value)}
                            className="px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 text-sm font-mono font-semibold text-slate-800 bg-white"
                          />
                          {formData.dates.length > 1 && (
                            <button
                              type="button"
                              onClick={() => handleRemoveDate(index)}
                              className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition"
                              title="移除此日期"
                            >
                              <i data-lucide="x" className="w-4 h-4"></i>
                            </button>
                          )}
                        </div>
                      ))}

                      {formData.dates.length < 5 && (
                        <button
                          type="button"
                          onClick={handleAddDate}
                          className="p-2.5 bg-white hover:bg-white text-white hover:text-[#CCCCCC] transition-colors duration-300 flex items-center justify-center font-bold focus:outline-none rounded-lg"
                        >
                          <i data-lucide="plus" className="w-5 h-5"></i>
                        </button>
                      )}
                    </div>
                    <p className="text-[11px] text-indigo-500">
                      * 僅開放：{semesterStart} ~ {semesterEnd} 之間的工作日。
                    </p>
                  </div>

                  <div className="space-y-1.5">
                    <label className="block text-sm font-bold text-slate-700">
                      使用的年級班級 (活動或研習 請填其他) <span className="text-red-500">*</span>
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="例如: 701、806 或 其他 (最多 3 位數字)"
                      value={formData.grade}
                      onChange={handleGradeChange}
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 text-sm"
                    />
                    <p className="text-[11px] text-slate-400">
                      * 僅允許輸入最多 3 個數字（如 701、806）或「其他」。
                    </p>
                  </div>

                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between">
                      <label className="block text-sm font-bold text-slate-700">
                        使用節次 (請按照課表勾選，最多可勾選 2 個節次) <span className="text-red-500">*</span>
                      </label>
                      <span className={`text-xs font-semibold ${formData.sessions.length >= 2 ? 'text-amber-600 font-bold' : 'text-slate-400'}`}>
                        已選擇 {formData.sessions.length} / 2 節
                      </span>
                    </div>
                    
                    <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5">
                      {SESSIONS.map((session, idx) => {
                        const isSelected = formData.sessions.includes(session.name);
                        const isMaxReached = formData.sessions.length >= 2 && !isSelected;
                        const isDisabled = !session.reservable || isMaxReached;

                        return (
                          <label
                            key={idx}
                            className={`flex flex-col p-2.5 rounded-xl border text-center relative ${
                              !session.reservable
                                ? "bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed"
                                : isSelected 
                                  ? "border-indigo-600 bg-indigo-50/70 text-indigo-900 font-semibold shadow-sm cursor-pointer" 
                                  : isMaxReached
                                    ? "bg-slate-50 border-slate-200 text-slate-300 cursor-not-allowed"
                                    : "border-slate-200 hover:bg-slate-50 text-slate-600 cursor-pointer"
                            }`}
                          >
                            <input
                              type="checkbox"
                              checked={isSelected}
                              disabled={isDisabled}
                              onChange={() => handleCheckboxChange(session.name)}
                              className="sr-only"
                            />
                            <span className="text-xs font-bold flex items-center justify-center gap-1">
                              {!session.reservable && <i data-lucide="lock" className="w-3 h-3"></i>}
                              {session.name}
                            </span>
                            <span className="text-[10px] text-slate-400 mt-0.5">
                              {!session.reservable ? "不開放預約" : isMaxReached ? "已達2節上限" : session.time}
                            </span>
                          </label>
                        );
                      })}
                    </div>
                  </div>


                    {/* ===== 新增：備註欄位 (需求 1) ===== */}
                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between">
                      <label className="block text-sm font-bold text-slate-700">
                        備註
                      </label>
                      <span className="text-xs text-slate-400">
                        {formData.note ? formData.note.length : 0} / 50 字
                      </span>
                    </div>
                    <textarea
                      maxLength="50"
                      rows="2"
                      placeholder="如有特殊需求或說明請在此填寫 (限 50 字內)"
                      value={formData.note || ""}
                      onChange={(e) => setFormData(prev => ({ ...prev, note: e.target.value }))}
                      className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 text-sm resize-none"
                    />
                  </div>
                  
                  {duplicateWarning && (
                    <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl space-y-2">
                      <p className="text-sm font-bold text-amber-800 flex items-center gap-1.5">
                        <i data-lucide="alert-triangle" className="w-5 h-5 flex-shrink-0 text-amber-600"></i>
                        {duplicateWarning.message}
                      </p>
                      <ul className="list-disc pl-6 text-xs text-amber-700 font-medium space-y-1">
                        {duplicateWarning.conflicts.map((conflict, i) => (
                          <li key={i}>{conflict}</li>
                        ))}
                      </ul>
                      <p className="text-[10px] text-amber-600 italic mt-1">
                        * 雖然系統不限制重複登載，但建議您與上述教師協調借用事宜以避免平板設備分配衝突。
                      </p>
                    </div>
                  )}
                  <div className="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => {
                        setActiveTab("timetable");
                        showNotification("已切換至週課表查看檢視。", "info");
                      }}
                      className="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-semibold transition"
                    >
                      查看週課表
                    </button>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className={`px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-md hover:shadow-lg transition flex items-center gap-2 ${
                        isSubmitting ? 'opacity-50 cursor-not-allowed' : ''
                      }`}
                    >
                      {isSubmitting ? (
                        <>
                          <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i>
                          處理中...
                        </>
                      ) : (
                        <>
                          <i data-lucide="check" className="w-4 h-4"></i>
                          確認送出預約
                        </>
                      )}
                    </button>
                  </div>
                </form>
              </div>
            )}

            {/* TAB 2: DETAILED LIST */}
            {activeTab === "list" && isAdmin && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden animate-fadeIn">
                <div className="p-4 md:p-6 bg-slate-50 border-b border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                      平板預約明細紀錄與篩選
                    </h2>
                    <p className="text-slate-500 text-xs mt-0.5">
                      您可以依照教師姓名、用途、平板編號或借用班級進行搜尋篩選。點擊教師姓名可直接複製資料至表單。
                    </p>
                  </div>
                  <div className="flex flex-wrap items-center gap-2.5">
                    <button
                      onClick={fetchReservationsFromGAS}
                      disabled={isSyncing}
                      className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 transition shadow-sm"
                      title="重新整理資料"
                    >
                      <i data-lucide="refresh-cw" className={`w-3.5 h-3.5 ${isSyncing ? 'animate-spin' : ''}`}></i>
                      重新整理
                    </button>
                    {isPrimaryAdmin && (
                      <button
                        onClick={handleCsvExport}
                        className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold inline-flex items-center gap-1.5 transition shadow-sm"
                      >
                        <i data-lucide="download" className="w-4 h-4"></i>
                        匯出篩選結果
                      </button>
                    )}
                  </div>
                </div>
                <div className="p-4 bg-slate-100/40 border-b border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="relative">
                    <span className="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                      <i data-lucide="search" className="w-4 h-4"></i>
                    </span>
                    <input
                      type="text"
                      placeholder="搜尋教師、班級、平板、日期..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full pl-9 pr-4 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white"
                    />
                  </div>
                  <div className="flex items-center gap-2">
                    <label className="text-xs text-slate-500 font-bold whitespace-nowrap">用途篩選:</label>
                    <select
                      value={filterPurpose}
                      onChange={(e) => setFilterPurpose(e.target.value)}
                      className="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500 bg-white"
                    >
                      <option value="全部">顯示全部</option>
                      {PURPOSES.map((p, idx) => (
                        <option key={idx} value={p}>{p}</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex items-center justify-end text-xs text-slate-500 font-semibold px-2">
                    <span>已篩選出：{filteredReservations.length} 筆借用預約</span>
                  </div>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full border-collapse text-left">
                    <thead>
                      <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-bold">
                        <th className="p-4">用途</th>
                        <th className="p-4">借用日期</th>
                        <th className="p-4">使用節次</th>
                        <th className="p-4">使用年級/班級</th>
                        <th className="p-4">借用教師 (點擊複製資料)</th>
                        <th className="p-4">分配平板編號</th>
                        <th className="p-4 text-center">管理動作</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200 text-sm">
                      {filteredReservations.length > 0 ? (
                        filteredReservations.map((res, idx) => {
                          let purposeBadge = "bg-indigo-50 text-indigo-700 border-indigo-200";
                          if (res.purpose === "研習") purposeBadge = "bg-amber-50 text-amber-700 border-amber-200";
                          if (res.purpose === "行政業務") purposeBadge = "bg-slate-50 text-slate-700 border-slate-200";
                          if (res.purpose === "社團") purposeBadge = "bg-emerald-50 text-emerald-700 border-emerald-200";
                          if (res.purpose === "其他") purposeBadge = "bg-purple-50 text-purple-700 border-purple-200";

                          const todayStr = formatDate(new Date());
                          const isOverdue = res.date < todayStr;

                          return (
                            <tr key={idx} className="hover:bg-slate-50/50 transition">
                              <td className="p-4">
                                <span className={`px-2.5 py-1 rounded-full text-xs font-semibold border ${purposeBadge}`}>
                                  {res.purpose}
                                </span>
                              </td>
                              <td className="p-4 font-mono font-medium text-slate-700">
                                {res.date.replace(/-/g, "/")}
                              </td>
                              <td className="p-4">
                                <div className="flex flex-wrap gap-1">
                                  {res.sessions.map((sess, sIdx) => (
                                    <span key={sIdx} className="bg-slate-100 text-slate-700 border border-slate-200 text-[10px] px-2 py-0.5 rounded">
                                      {sess}
                                    </span>
                                  ))}
                                </div>
                              </td>
                              <td className="p-4 font-semibold text-slate-800">
                                {res.grade}
                              </td>
                              <td className="p-4">
                                <button
                                  type="button"
                                  onClick={() => handleCopyTeacherInfo(res)}
                                  className="group flex flex-col text-left focus:outline-none p-1 -m-1 rounded-lg hover:bg-indigo-50 transition"
                                  title="點擊以帶入此教師名稱、信箱與用途至預約表單"
                                >
                                  <span className="font-bold text-indigo-600 group-hover:text-indigo-800 group-hover:underline flex items-center gap-1">
                                    {res.teacher} 老師
                                    <i data-lucide="copy" className="w-3 h-3 text-indigo-400 group-hover:text-indigo-600"></i>
                                  </span>
                                  <span className="text-[10px] text-slate-400 font-mono">{res.email}</span>
                                </button>
                              </td>
                              <td className="p-4 font-semibold">
                                <div className="flex items-center gap-1.5">
                                  {res.tabletCode ? (
                                    <span className="bg-slate-100 text-slate-800 text-xs px-2 py-1 rounded font-mono font-bold border border-slate-200 break-all">
                                      {res.tabletCode}
                                    </span>
                                  ) : isOverdue ? (
                                    <span className="bg-amber-50 text-amber-700 text-xs px-2 py-1 rounded font-bold border border-amber-200">
                                      未分配已超時
                                    </span>
                                  ) : (
                                    <span className="bg-red-50 text-red-600 text-xs px-2 py-1 rounded font-bold border border-red-100">
                                      未分配
                                    </span>
                                  )}
                                  <button 
                                    onClick={() => openTabletAssign(res)}
                                    className="p-1 rounded transition text-indigo-600 hover:bg-indigo-50"
                                    title="指派平板編號"
                                  >
                                    <i data-lucide="settings" className="w-3.5 h-3.5"></i>
                                  </button>
                                </div>
                              </td>
                              <td className="p-4 text-center">
                                {isPrimaryAdmin ? (
                                  <button
                                    onClick={() => requestDelete(res)}
                                    className="p-2 rounded-lg transition inline-flex items-center gap-1 text-xs font-semibold text-red-500 hover:text-red-700 hover:bg-red-50"
                                    title="取消平板借用"
                                  >
                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                    取消預約
                                  </button>
                                ) : (
                                  <span className="text-slate-400 text-xs flex items-center justify-center gap-1 italic" title="次要管理員帳號不具備刪除紀錄權限">
                                    <i data-lucide="lock" className="w-3.5 h-3.5"></i>
                                    無刪除權限
                                  </span>
                                )}
                              </td>
                            </tr>
                          );
                        })
                      ) : (
                        <tr>
                          <td colSpan="7" className="p-12 text-center text-slate-400">
                            <div className="flex flex-col items-center justify-center gap-2">
                              <i data-lucide="folder-open" className="w-8 h-8 opacity-60 text-slate-300"></i>
                              <p className="text-sm font-medium">沒有找到符合您搜尋條件的借用預約紀錄。</p>
                            </div>
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 3: WEEK TIMETABLE */}
            {activeTab === "timetable" && (
              <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden animate-fadeIn">
                <div className="p-4 md:p-6 bg-slate-50 border-b border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                      平板使用狀況週課表 {isAdmin ? "(管理員模式 - 顯示全部預約)" : "(僅顯示已指派平板編號之紀錄)"}
                    </h2>
                    <p className="text-slate-500 text-xs mt-0.5">
                      💡 提示：點擊週課表中任何【可借用】空白欄位即可帶入預約。
                      {isAdmin 
                        ? "管理員模式下，包含未指派平板的預約紀錄亦會顯示，方便直接點擊圖示進行平板分派與管理。" 
                        : "本課表僅顯示已被指派平板編號之預約。"}
                    </p>
                  </div>
                  <div className="flex flex-wrap items-center gap-3">
                    <button
                      onClick={() => changeWeek(-1)}
                      className="bg-white hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold inline-flex items-center gap-1 transition"
                    >
                      <i data-lucide="chevron-left" className="w-3.5 h-3.5"></i> 上一週
                    </button>
                    <button
                      onClick={goToTodayWeek}
                      className="bg-white hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold transition"
                    >
                      回到今日
                    </button>
                    <button
                      onClick={() => changeWeek(1)}
                      className="bg-white hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 text-xs font-semibold inline-flex items-center gap-1 transition"
                    >
                      下一週 <i data-lucide="chevron-right" className="w-3.5 h-3.5"></i>
                    </button>
                    
                    <span className="text-slate-400 mx-1">|</span>
                    
                    <div className="flex items-center gap-2">
                      <label className="text-xs text-slate-500 font-medium">快速跳週:</label>
                      <input
                        type="date"
                        onChange={handleWeekJump}
                        className="bg-white border border-slate-200 rounded-lg px-2 py-1 text-xs text-slate-700 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                      />
                    </div>
                  </div>
                </div>
                <div className="px-4 py-3 bg-indigo-50/50 border-b border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-3 text-xs font-semibold text-indigo-900">
                  <div className="flex items-center gap-1.5">
                    <i data-lucide="clock" className="w-4 h-4 text-indigo-600"></i>
                    <span>目前查看週別：{formatDate(selectedWeekStart).replace(/-/g, "/")} (一) ~ {currentWeekDays[5].dateStr.replace(/-/g, "/")} (六)</span>
                  </div>
                  
                  {isAdmin ? (
                    isPrimaryAdmin ? (
                      <button
                        onClick={handleWordExportClick}
                        className="bg-white hover:bg-blue-50 text-blue-700 border border-blue-300 px-3 py-1 rounded-lg text-xs font-bold inline-flex items-center gap-1 transition shadow-sm"
                      >
                        <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                        匯出課表為 Word / Google Doc
                      </button>
                    ) : null
                  ) : (
                    <span className="text-slate-400 text-[11px]">課表Word匯出需管理者登入</span>
                  )}
                </div>
                
                <div className="overflow-x-auto p-4 bg-slate-50/50">
                  <div 
                    className="grid bg-slate-200 gap-[1px] border border-slate-200 rounded-xl overflow-hidden min-w-[950px]"
                    style={{
